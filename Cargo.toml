[package]
name = "chain-gang"
version = "0.11.0"
description = "This is a library that enables monitoring of multiple blockchains (BTC, BCH, BSV)."
repository = "https://github.com/nchain-innovation/chain-gang"
homepage = "https://github.com/nchain-innovation/chain-gang"
documentation = "https://docs.rs/chain-gang"
authors = ["Arthur Gordon <a.gordon@teranode.group>"]
keywords = ["bitcoin", "sv", "cash", "crypto"]
license = "MIT"
edition = "2021"
readme = "docs/README-chain-gang.md"

[dependencies]
byteorder = "1.5"
dns-lookup = "4.0.1"
hex = "0.4.3"
linked-hash-map = "0.5"
log = { version = "0.4.33", features = ["max_level_trace", "release_max_level_warn"] }
thiserror = "2.0.19"
url = "2.5.8"

# Crypto
murmur3 = "0.5.2"
num-bigint = "0.5.1"
num-traits = "0.2"
rand = "0.10.2"
ripemd = "0.2.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
k256 = { version = "0.14.0", features = ["alloc", "arithmetic", "digest", "ecdsa", "getrandom", "pkcs8", "precomputed-tables", "schnorr",
    "sha2", "sha256", "signature", "std"]}

hmac = "0.13.0"
bs58 = "0.5.1"
pbkdf2 = { version = "0.13.0", features = ["hmac", "sha2"] }

# Required, not optional: serde derives appear on public types across the crate,
# and ChainGangError carries a serde_json::Error variant that is not gated.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }

# Used by the interface feature
reqwest = { version = "0.13.4", features = ["json"], optional = true }
async-lock = { version = "3.4.2", optional = true }
async-trait = { version = "0.1.91", optional = true }

# For python feature
# abi3-py311 builds against the stable ABI: one wheel (cp311-abi3) works on
# 3.11, 3.12, 3.13, 3.14 and every future CPython, so no per-version matrix
# and no missing-version gaps. Floor matches `requires-python` in pyproject.toml.
pyo3 = { version = "0.29.0", optional = true, features = ["abi3-py311"] }
regex = "1.13.1"

[lib]
name = "chain_gang"
crate-type = ["cdylib", "lib"]

[profile.release]
opt-level = "s"     # Optimize for size over speed
lto = true          # Enable link-time optimizations to shrink binary

[features]
# serde and serde_json are unconditional dependencies, so there is nothing
# left for the default feature to switch on
default = []
interface = ["dep:reqwest", "dep:async-lock", "dep:async-trait"]
python = ["dep:pyo3"]
