name: CI
# CI runner image is pinned, not `ubuntu-latest`. That label migrates to Ubuntu 26
# from 19 October 2026 (actions/runner-images#14748), which would move the OS under
# every build on a date nobody chose. Pinning decouples the upgrade from that date
# so it happens deliberately, with someone watching. Tracked as CS-442.

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

env:
  # Disable cargo's HTTP/2 multiplexing to avoid intermittent
  # "[16] Error in the HTTP2 framing layer" failures when fetching from crates.io.
  CARGO_HTTP_MULTIPLEXING: false

# Wheels are built against the stable ABI (pyo3 abi3-py311), so a single
# cp311-abi3 wheel per platform covers Python 3.11 through 3.14 and beyond.
# No --find-interpreter and no per-version matrix are needed.

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    if: "startsWith(github.ref, 'refs/tags/')"
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          #- runner: ubuntu-24.04
          #  target: x86
          #- runner: ubuntu-24.04
          #  target: aarch64
          # - runner: ubuntu-24.04
          #  target: armv7
          #- runner: ubuntu-24.04
          #  target: s390x
          #- runner: ubuntu-24.04
          #  target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.11
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    if: "startsWith(github.ref, 'refs/tags/')"
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.11
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    if: "startsWith(github.ref, 'refs/tags/')"
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.11
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    if: "startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    steps:
      - uses: actions/download-artifact@v8
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    if: "startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Resolve version and check tag
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml version: $VERSION, tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Git tag ($TAG) does not match Cargo.toml version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip if already published
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/chain-gang/${{ steps.version.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "chain-gang ${{ steps.version.outputs.version }} already on crates.io — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
