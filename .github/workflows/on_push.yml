name: On Push
# CI runner image is pinned, not `ubuntu-latest`. That label migrates to Ubuntu 26
# between 19 October and 19 November 2026 (actions/runner-images#14748), which
# would move the OS under every build on a date nobody chose. Pinning decouples
# the upgrade from that date so it happens deliberately (CS-442).
#
# Now on 26.04, moved ahead of the migration on the evidence of a trial rather
# than by the calendar (CS-444). This repo is where the trial actually found
# something: the first Ubuntu 26 run failed with
# `rust-lld: error: unable to find library -lpython3.12`, which looked exactly
# like an image incompatibility -- 24.04 ships Python 3.12, 26.04 ships 3.13 --
# and was not one. A 24.04 cache had been restored onto 26.04, carrying pyo3
# build output already resolved against 3.12. A control run with the cache
# disabled passed clean on 26.04.
#
# Hence `cache-key` below carries the image, and moving it is what busts the
# old cache rather than restoring it across the boundary. Keep it in step with
# `runs-on`: this is the repo that proves what happens when they disagree.
#
# CI.yml is now on 26.04 too (CS-459). It was held back while this file moved
# (CS-444), on the worry that `manylinux: auto` derives the wheel's glibc
# baseline from the runner, so a newer image could raise the minimum glibc of a
# published wheel and break downstream installs without failing anything here.
#
# That worry turned out to be misplaced, and it took a measurement rather than
# a tag to show it: the same build on both images produced identical wheel tags
# (manylinux_2_17), because maturin-action builds inside
# quay.io/pypa/manylinux2014_x86_64 either way. The baseline comes from that
# container, not from the runner, so host glibc -- 2.39 on 24.04, 2.43 on
# 26.04 -- never reaches the wheel.
on: [push]
permissions:
  contents: read
env:
  # Disable cargo's HTTP/2 multiplexing to avoid intermittent
  # "[16] Error in the HTTP2 framing layer" failures when fetching from crates.io.
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  python-lint:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch code
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Lint Python
        working-directory: python
        run: |
          pip install mypy flake8 types-requests --root-user-action=ignore
          flake8 --ignore=E501,E131,E402,E722 src ../tools
          mypy --check-untyped-defs --ignore-missing-imports src ../tools 

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch code
        uses: actions/checkout@v7
      # `cargo test --all-features` enables `python`, which pulls in pyo3, but
      # NOT `pyo3/extension-module` -- so unlike the maturin builds, the test
      # binary links libpython directly. Without this step it linked whatever
      # the runner image happened to ship, which is the only reason this job
      # was sensitive to the image at all. 3.11 is the abi3 floor the crate
      # targets and the interpreter the wheels are built with, so this tests
      # against the oldest Python we claim to support.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Rust 
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-key: ubuntu-26.04-py3.11
      - name: Rust Tests
        run: cargo test --all-features

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: true
          cache-key: ubuntu-26.04
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: true
          cache-key: ubuntu-26.04
      - name: Format
        run: cargo fmt --all -- --check

  # The test and clippy jobs above both build --all-features, so a module or
  # item gated on the wrong feature compiles there and still breaks a dependent
  # that enables only some of them. This checks each set a dependent might pick.
  rust-features:
    name: Rust Features (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: interface
            args: "--features interface"
          - name: python
            args: "--features python"
          - name: no-default
            args: "--no-default-features"
    steps:
      - name: Checkout branch code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-key: ubuntu-26.04
      - name: Check
        run: cargo check --all-targets ${{ matrix.args }}

  python-test:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout branch code
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Rust 
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-key: ubuntu-26.04
      - name: Clear wheel dir
        run: rm target/wheels/* | true
      - name: Maturin build
        uses: PyO3/maturin-action@v1
        with:
          command: build --target-dir=target
      - name: Install wheel
        run: pip install --root-user-action=ignore --find-links=target/wheels tx-engine
      - name: Python tests
        working-directory: python
        run: ./tests.sh
